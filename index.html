<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Singapore Transit Map</title>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      html,body,#map { height: 100%; margin: 0; padding: 0; }
      #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
      #zoom-hint { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,0.9); padding: 6px 8px; border-radius: 4px; display: none; z-index: 2; }
    </style>
  </head>
  <body>
    <div id="zoom-hint">Zoom in to see live buses</div>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
